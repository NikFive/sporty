# yaml-language-server: $schema=./schema/settings.schema.json
# Общие настройки плана. Контракт и примеры — plan/README.md. Проверка: npm run validate
#
#   athletes — кто тренируется (ключ = id атлета: слоты в шаблонах, athletes: [...] в календаре)
#   race     — ориентир гонки (дата должна совпадать с событием kind: race в calendar.yaml)
#   restDay  — фиксированный выходной (mon..sun); в каждом шаблоне ровно этот день = rest
#   zones    — описание зон (общее; цифры у каждого свои)

athletes:
  nikita: { name: Никита, about: полная силовая и плиометрика }
  vanya: { name: Ваня, about: "минимум силовой, больше выносливости" }

race:
  title: 70.3 Ironman
  date: "2027-07-18"
  tentative: true # конкретная гонка не выбрана — ориентир «лето 2027»
  distances: 1.9 км плавание · 90 км вел · 21.1 км бег

restDay: mon

zones:
  z1: { name: Восстановление, rpe: "1–2", talk: "можно петь, дыхание носом" }
  z2: { name: Аэробная база, rpe: "3–4", talk: "говоришь предложениями" }
  z3: { name: Темп, rpe: "5–6", talk: "говоришь фразами — «серая зона», минимум" }
  z4: { name: Порог, rpe: "7–8", talk: "только отдельные слова" }
  z5: { name: VO2max, rpe: "9", talk: "говорить не получается" }
