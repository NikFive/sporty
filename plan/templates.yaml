# yaml-language-server: $schema=./schema/templates.schema.json
# Шаблоны недели. Контракт и примеры — plan/README.md. Проверка: npm run validate
#
# Каждый день mon..sun: либо rest, либо { together: [...], nikita: [...], vanya: [...] }
#   together — тренируемся вместе; nikita / vanya — личные модули.
#   Ссылка: id тренировки из workouts.yaml; id@am — утро, id@pm — вечер (без суффикса — когда удобно).
# В каждом шаблоне ровно один rest, и он совпадает с restDay из settings.yaml.
# draft: true — шаблон-черновик, UI помечает «детали могут поменяться».
#
# Прогрессия: внутри блока каждая нагрузочная неделя чуть больше предыдущей (в основном длинные тренировки
# выходных и число отрезков), потом разгрузка ×0.7 на шаблоне последней недели блока. Следующий блок стартует выше прошлого.
#
# Логика недели (время: будни — один заход в зал, выходные — до двух сессий):
#   • будни: кардио + силовая в одном заходе — только когда кардио лёгкое (Z2). Тяжёлое кардио — отдельный день без силовой ног.
#   • 80/20: 1–2 ключевые сессии в неделю, остальное Z1–Z2. Ключевые в базе — «норвежский» суб-порог (контроль, не на износ).
#   • Никита: плечо (реконструкция AC) → этапы op → rtr → sh → полный план. Ваня всё это время идёт по обычной базе.
#   • Силовая Никиты: база — 3 (A ноги, B ноги, C верх/ЛФК); build/специфика — 2 (поддержка + верх) + плиометрика.

templates:
  # ── База I · 9–22 ноября. Плечо Никиты уже порвано — верх не грузим.
  base1_1:
    title: База I · нед. 1
    days:
      mon: rest
      tue: { together: [run_easy_strides], nikita: [strength_legs_a], vanya: [strength_min_a] }
      wed: { together: [bike_sub_4] }
      thu: { together: [run_z2], nikita: [plyo_a, strength_legs_b], vanya: [strength_min_b] }
      fri: { together: [bike_z2] }
      sat: { together: [run_long_70] }
      sun: { together: [bike_long_100, run_off_bike] }

  base1_2:
    title: База I · нед. 2
    days:
      mon: rest
      tue: { together: [run_easy_strides], nikita: [strength_legs_a], vanya: [strength_min_a] }
      wed: { together: [bike_sub_5] }
      thu: { together: [run_z2], nikita: [plyo_a, strength_legs_b], vanya: [strength_min_b] }
      fri: { together: [bike_z2] }
      sat: { together: [run_long_75] }
      sun: { together: [bike_long_110, run_off_bike] }

  # ── Операция и 0–2 нед. после: Никита — ходьба, лёгкий станок, ноги в тренажёрах. Ваня — 3-я ступень базы.
  base1_op:
    title: База I · Никита после операции
    days:
      mon: rest
      tue: { nikita: [walk_incline, strength_legs_light], vanya: [run_easy_strides, strength_min_a] }
      wed: { nikita: [bike_easy_postop], vanya: [bike_sub_6] }
      thu: { nikita: [walk_incline], vanya: [run_z2, strength_min_b] }
      fri: { nikita: [bike_easy_postop, strength_legs_light], vanya: [bike_z2] }
      sat: { nikita: [walk_incline], vanya: [run_long_80] }
      sun: { nikita: [bike_easy_postop], vanya: [bike_long_120, run_off_bike] }

  # ── 2–6 нед. после операции (декабрь): Никита — бег-шаг ступенями, вел, ноги тяжело, ЛФК.
  base1_rtr_1:
    title: База I · возвращение 1
    days:
      mon: rest
      tue: { nikita: [run_walk_return, strength_legs_a], vanya: [run_easy_strides, strength_min_a] }
      wed: { together: [bike_sub_4] }
      thu: { nikita: [run_walk_return, strength_legs_b], vanya: [run_z2, strength_min_b] }
      fri: { together: [bike_z2] }
      sat: { nikita: [run_walk_long], vanya: [run_long_80] }
      sun: { together: [bike_long_110], vanya: [run_off_bike], nikita: [shoulder_rehab@pm] }

  base1_rtr_2:
    title: База I · возвращение 2
    days:
      mon: rest
      tue: { nikita: [run_walk_return, strength_legs_a], vanya: [run_easy_strides, strength_min_a] }
      wed: { together: [bike_sub_5] }
      thu: { nikita: [run_walk_return, strength_legs_b], vanya: [run_z2, strength_min_b] }
      fri: { together: [bike_z2] }
      sat: { nikita: [run_walk_long], vanya: [run_long_85] }
      sun: { together: [bike_long_120], vanya: [run_off_bike], nikita: [shoulder_rehab@pm] }

  base1_rtr_3:
