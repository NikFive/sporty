  # ───────── ПЛАВАНИЕ ─────────
  swim_technique:
    sport: swim
    title: Плавание — техника
    warmup: 200 м спокойно любым стилем.
    main: 8 × 50 м упражнения (catch-up, одна рука, «доска на боку») + 4 × 100 м кролем в Z2, фокус на выдохе в воду.
    cooldown: 100 м спокойно.
    segments: [[8, z1], [22, z1], [12, z2], [3, z1]]
    why: В плавании экономичность гребка решает больше, чем «мотор». Пока база — ставим технику, объём придёт в build.
    ref: Toussaint & Hollander 1994
    notes:
      nikita: Первые недели после восстановления — без лопаток и резких усилий. Слушай ощущения.
      vanya: Работаешь над тем же — техника у вас обоих важнее объёма.

  swim_aerobic:
    sport: swim
    title: Плавание Z2
    warmup: 300 м спокойно.
    main: 4 × 200 м в Z2 через 30 с отдыха + 4 × 50 м упражнения.
    cooldown: 100 м спокойно.
    segments: [[8, z1], [32, z2], [6, z1], [4, z1]]
    why: Аэробная база в воде и привычка держать технику, когда устаёшь.
    ref: Seiler 2010

  swim_css:
    sport: swim
    title: Плавание — CSS
    formula: 10×100 м CSS
    warmup: 400 м спокойно + 4 × 50 м с ускорением.
    main: 10 × 100 м на темпе CSS (Z4) через 15 с отдыха.
    cooldown: 200 м спокойно.
    segments: [[12, z1], { x: 10, set: [[1.8, z4], [0.25, z1]] }, [6, z1]]
    why: CSS — пороговый темп в воде. Работа на нём поднимает скорость, которую держишь 1.9 км.
    ref: Stöggl & Sperlich 2014

  swim_short:
    sport: swim
    title: Плавание — активация
    formula: 4×100 м Z3
    warmup: 300 м спокойно.
    main: 4 × 100 м бодро (Z3) через 30 с.
    cooldown: 200 м спокойно.
    segments: [[8, z1], { x: 4, set: [[2, z3], [1, z1]] }, [10, z1]]
    why: Сохраняем чувство воды, не тратя силы.
    ref: Mujika & Padilla 2003

  swim_rehab:
    sport: swim
    title: Бассейн без гребка
    main: 10 мин аквабег (глубокая вода с поясом или по грудь) · 6 × 50 м ноги в ластах на спине, руки вдоль тела · 10 мин ходьба и бег в воде. Без кроля, без доски в вытянутых руках.
    segments: [[10, z2], [15, z2], [10, z1]]
    why: Пока плечу нельзя гребок, вода всё равно даёт объём без удара и привычку к бассейну. Кроль после реконструкции ключично-акромиального сустава обычно разрешают примерно через 12 недель.
    notes:
      nikita: Только когда шов зажил и хирург разрешил воду. Не разрешил — вместо этого 40 мин вел Z2.

  swim_long:
    sport: swim
    title: Плавание — длинное
    formula: 3×600 м Z2
    warmup: 300 м спокойно.
    main: 3 × 600 м в Z2 через 30 с отдыха. Каждые 6 вдохов — взгляд вперёд, как в открытой воде. В последний месяц — 1500–1900 м без остановки.
    cooldown: 100 м спокойно.
    segments: [[8, z1], { x: 3, set: [[12, z2], [1, z1]] }, [5, z1]]
    why: Гоночные 1.9 км надо уметь проплыть ровно и выйти из воды свежим. Длинные отрезки дают и выносливость, и уверенность.
    ref: Seiler 2010

