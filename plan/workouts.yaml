  run_sub_5:
    sport: run
    title: "Бег — суб-порог"
    formula: "5×6 мин суб-порог"
    warmup: "10 мин Z1, затем 3 × 20 с ускорения."
    main: "5 × 6 мин чуть ниже порога (низ Z4 — пульс на 5–8 ударов ниже ПАНО, дыхание глубокое, но под контролем), между ними 1 мин трусцой. Закончить с ощущением «мог бы ещё 1–2»."
    cooldown: "8 мин легко."
    segments: [[12, z1], { x: 5, set: [[6, z4], [1, z1]] }, [8, z1]]
    why: "Это «норвежский» подход в любительской дозе. Много работы чуть ниже порога с короткими паузами даёт сильный аэробный стимул, а усталость от неё намного меньше, чем от VO2max. Поэтому её можно делать регулярно и не ломать остальную неделю."
    ref: "Casado et al. 2023"
    notes:
      nikita: "Главная ошибка — уйти выше порога. Пульс ползёт вверх на 4–5-м отрезке — сбавь скорость на 0.3–0.5 км/ч."
      vanya: "Не гонись за скоростью, суть в контроле. Отрезки одинаковые, последний не быстрее первого."

