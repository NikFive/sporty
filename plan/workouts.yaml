  # ───────── ВЕЛ ─────────
  bike_z2:
    sport: bike
    title: Вел Z2
    warmup: 10 мин Z1.
    main: 60 мин в Z2, каденс 85–95.
    cooldown: 5 мин Z1.
    segments: [[10, z1], [60, z2], [5, z1]]
    why: Аэробный объём почти без ударной нагрузки — можно накатывать часы без риска для связок.
    ref: Seiler 2010
    notes:
      nikita: "Ориентир сейчас ≈ 120–145 Вт. 150 Вт — это уже верх Z2, держись ниже. После теста дам точные цифры."
      vanya: "Ориентир сейчас ≈ 120–145 Вт. 150 Вт — верх Z2. Каденс 85–95."

  bike_openers:
    sport: bike
    title: Вел — активация
    warmup: 10 мин Z1.
    main: 20 мин Z2 + 3 × 2 мин в Z4 через 2 мин легко.
    cooldown: 3 мин Z1.
    segments: [[10, z1], [20, z2], { x: 3, set: [[2, z4], [2, z1]] }, [3, z1]]
    why: Короткая острота без усталости перед гонкой.
    ref: Mujika & Padilla 2003

  bike_easy_postop:
    sport: bike
    title: Вел лёгкий — после операции
    main: 35 мин Z1–Z2 на горизонтальном (recumbent) или обычном станке. Руки не опираются на руль, максимум — здоровая рука.
    segments: [[5, z1], [25, z2], [5, z1]]
    why: Велостанок — самый безопасный способ держать сердце в работе, пока плечо в покое. Удара нет, падать некуда.
    notes:
      nikita: Только с разрешения хирурга. Если сидеть с фиксатором неудобно — ходьба в горку.

  test_bike_20:
    sport: bike
    title: Тест — 20 мин вел
    formula: 20 мин тест
    warmup: 10 мин Z1–Z2, затем 3 × 1 мин бодро через 1 мин легко, 3 мин легко.
    main: 20 мин максимально ровно на одном станке (всегда на одном и том же). Запиши среднюю мощность и средний пульс за последние 10 мин.
    cooldown: 10 мин Z1.
    segments: [[10, z1], { x: 3, set: [[1, z4], [1, z1]] }, [3, z1], [20, z4], [10, z1]]
    zone: z4
    why: FTP ≈ 95% от средней мощности за 20 мин. От неё считаются все ватты — Z2, суб-порог, мощность гонки.
    ref: Allen & Coggan 2010
    notes:
      nikita: Первые 5 мин чуть сдержанно, последние 5 — всё, что осталось. Скинь ватты и пульс.
      vanya: Скинь ватты и пульс — пересчитаю зоны.

  # ── вел: ступени прогрессии, число в id = минуты или повторы ──
  bike_long_100:
    sport: bike
    title: "Длинный вел"
    warmup: "10 мин Z1."
    main: "85 мин в Z2, каденс 85–95. Каждые 20 мин — глоток, углеводы 40–60 г/ч."
    cooldown: "5 мин Z1."
    segments: [[10, z1], [85, z2], [5, z1]]
    why: "Вел — самая длинная часть 70.3 (90 км). Каждую нагрузочную неделю +10 мин в седле: жировой обмен, выносливость и привычка есть на ходу растут плавно."
    ref: "Seiler 2010"
    notes:
      nikita: "Ты тяжелее — на станке это не мешает, ватты в Z2 у тебя могут быть выше. Не сравнивайтесь."
      vanya: "Тот же Z2 по пульсу. Каденс держи высоким."

