# yaml-language-server: $schema=./schema/workouts.schema.json
# Библиотека тренировок. Контракт и примеры — plan/README.md. Проверка: npm run validate
#
# Ключ — id тренировки (латиница, цифры, _). На него ссылаются templates.yaml и calendar.yaml.
# Переименовал id → поправь все ссылки (validate покажет, где).
#
# segments — профиль для графика и статистики 80/20:
#   [минуты, зона]                      — отрезок; зоны: z1..z5, str (силовая), plyo, mob (мобилити), alt (альтернатива)
#   { x: 5, set: [[4, z5], [3, z1]] }   — повтор
# formula: «10×100 м CSS» — короткая формула основной части (иначе считается из первого повтора).
# zone: z4 — принудительная «ключевая зона» для цветного квадрата (иначе считается из segments).
# split: { bike: 140, run: 40 } — только у brick: минуты вела и бега (иначе 75% / 25%).
# notes: { nikita: ..., vanya: ... } — личные заметки атлету.

workouts:
  # ───────── БЕГ ─────────
  run_easy_strides:
    sport: run
    title: Лёгкий бег + ускорения
    warmup: 10 мин очень легко (Z1), последние 2 мин — беговые упражнения (захлёст, высокое бедро).
    main: 25 мин ровно в Z2. Затем 6 × 20 с ускорение до ~90% от максимума, между ними 40 с шагом.
    cooldown: 5 мин шагом, растяжка икр и сгибателей бедра.
    segments: [[10, z1], [25, z2], { x: 6, set: [[0.33, z5], [0.67, z1]] }, [5, z1]]
    why: Z2 растит митохондрии и капилляры — фундамент для 70.3. Короткие ускорения почти не утомляют, но учат нервную систему быстрой технике и улучшают экономичность бега.
    ref: Seiler 2010
    notes:
      nikita: Ориентир — пульс, не темп. Уползает в Z3 — замедлись или перейди на шаг на 30–60 с. В начале базы это нормально.
      vanya: Бежите вместе, но у Никиты свой пульс. Не тяни. Хочется быстрее — вложи это в ускорения, а не в темп.

  run_z2:
    sport: run
    title: Бег Z2
    warmup: 5 мин очень легко.
    main: 30 мин в Z2. Ровно, без «ну чуть быстрее».
    cooldown: 5 мин шагом.
    segments: [[5, z1], [30, z2], [5, z1]]
    why: Около 80% объёма — в лёгких зонах. Именно эти скучные минуты строят аэробный мотор, а нагрузка на организм остаётся небольшой.
    ref: Seiler 2010
    notes:
      nikita: "Сейчас твой Z2 на дорожке ≈ 7.0–7.5 км/ч (уклон 1%). Пульс выше Z2 — шаг 1 мин и снова бег. Лучше медленно, но в зоне."
      vanya: "Сейчас твой Z2 ≈ 8.0–8.5 км/ч (уклон 1%). Если бежите вместе — твой темп подстраивается, а не его."

  run_long_z2:
    sport: run
    title: Длинный бег
    warmup: 10 мин очень легко.
    main: 55 мин в Z2.
    cooldown: 5 мин шагом.
    segments: [[10, z1], [55, z2], [5, z1]]
    why: Главный стимул беговой выносливости — растут запасы гликогена, жир как топливо, крепнут связки. Строго Z2, иначе это уже другая тренировка.
    ref: Seiler 2010
    notes:
      nikita: "Ориентир ≈ 7.0–7.5 км/ч. Можно бег-шаг 9:1, если к концу пульс ползёт вверх (кардиодрейф). Возьми воду."
      vanya: Стартуете и финишируете вместе, середина — каждый в своей зоне.

  run_openers:
    sport: run
    title: Активация
    warmup: 10 мин Z1.
    main: 15 мин Z2 + 4 × 1 мин бодро (Z4) через 1 мин трусцой.
    cooldown: 2 мин шагом.
    segments: [[10, z1], [15, z2], { x: 4, set: [[1, z4], [1, z1]] }, [2, z1]]
    why: В подводке объём падает, а острота остаётся. Короткие отрезки держат ноги «живыми» без усталости.
    ref: Mujika & Padilla 2003

  run_off_bike:
    sport: run
    title: Бег после вела
    main: Сразу после вела (переодеться за 2–3 мин), 20 мин в Z2. Первые 5 мин — короткий частый шаг, пульс по нижней границе.
    segments: [[20, z2]]
    why: Мини-брик. Ноги привыкают бежать после педалей, и на гонке первые километры бега не будут шоком. Короткий — значит, почти не добавляет усталости.
    ref: Millet & Vleck 2000

  walk_incline:
    sport: run
    title: Ходьба в горку
    main: 45 мин на дорожке, уклон 8–12%, скорость 4.5–5.5 км/ч, пульс Z1–Z2. За поручни не держаться оперированной рукой.
    segments: [[5, z1], [35, z2], [5, z1]]
    why: Пока бегать нельзя, ходьба в горку держит аэробный мотор и ноги без тряски плеча. При твоём весе крутая ходьба легко выводит в Z2.
    notes:
      nikita: Рука в фиксаторе или прижата. Любая боль в плече — уменьшай уклон.

  run_walk_return:
    sport: run
    title: Бег-шаг — возвращение
    formula: бег/шаг по ступеням
    warmup: 5 мин шагом.
    main: "Дорожка, уклон 1%, только Z1–Z2. Неделя 1: 10 × (2 мин бег / 1 мин шаг). Неделя 2: 6 × (4 / 1). Неделя 3: 5 × (6 / 1). Неделя 4: 30 мин непрерывно. Переходишь на следующую ступень, только если плечо молчит."
    cooldown: 5 мин шагом.
    segments: [[5, z1], { x: 6, set: [[4, z2], [1, z1]] }, [5, z1]]
    why: Бег трясёт плечо, поэтому возвращаемся ступенями. Ноги и сердце помнят всё, а вот связка ключицы ещё срастается.
    notes:
      nikita: Только с разрешения хирурга. Руку держи прижатой, шаг короткий и мягкий. Ступень не пошла — остаёшься на ней ещё неделю.

  run_walk_long:
    sport: run
    title: Длинный бег-шаг
    warmup: 5 мин шагом.
    main: "60 мин Z1–Z2 бег-шаг по той же ступени, что на неделе (например, 2/1 → 4/1 → 6/1 → 10/1). Можно с уклоном 3–5% вместо скорости."
    cooldown: 7 мин шагом.
    segments: [[5, z1], { x: 8, set: [[5, z2], [1, z1]] }, [7, z1]]
    why: Сохраняем длинное время на ногах, пока бег непрерывно ещё не разрешён.
    notes:
      nikita: Только с разрешения хирурга. Болит плечо — переходи на ходьбу в горку.

  test_run_30:
    sport: run
    title: Тест — 30 мин бег
    formula: 30 мин тест
    warmup: 10 мин Z1, 5 мин Z2 с тремя ускорениями по 20 с.
    main: 30 мин максимально ровно — как будто бежишь соревнование на 30 мин в одиночку (дорожка, уклон 1%). Запиши средний пульс за последние 20 мин — это твой пульс ПАНО (LTHR). И среднюю скорость.
    cooldown: 10 мин легко.
    segments: [[10, z1], [5, z2], [30, z4], [10, z1]]
    zone: z4
    why: По этому тесту считаются личные зоны. Без него Z2 — это догадка. Повторяем раз в 2 месяца, чтобы видеть прогресс.
    ref: Friel 2009
    notes:
      nikita: Первые 10 мин не геройствуй. Скинь мне пульс и скорость — пересчитаю зоны.
      vanya: Бегите на соседних дорожках, но каждый в своём темпе. Скинь мне пульс и скорость.

  # ── бег: ступени прогрессии, число в id = минуты или повторы ──
  run_long_60:
    sport: run
    title: "Длинный бег"
    warmup: "10 мин очень легко."
    main: "45 мин в Z2. С собой вода."
    cooldown: "5 мин шагом."
    segments: [[10, z1], [45, z2], [5, z1]]
    why: "Главный стимул беговой выносливости — запасы гликогена, жир как топливо, крепкие связки. Растёт на 5 мин в неделю: время на ногах прибавляется, а риск травмы — нет. Строго Z2."
    ref: "Seiler 2010"
    notes:
      nikita: "Ориентир Z2 ≈ 7.0–7.5 км/ч. Бег-шаг 9:1 — нормальный инструмент, если к концу пульс ползёт вверх (кардиодрейф)."
      vanya: "Стартуете и финишируете вместе, середина — каждый в своей зоне. Ориентир Z2 ≈ 8.0–8.5 км/ч."

