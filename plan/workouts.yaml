    segments: [[10, z1], [5, z2], { x: 4, set: [[8, z4], [2, z1]] }, [8, z1]]
    why: "Тот же «норвежский» принцип — контролируемо чуть ниже порога. Поднимает пороговую мощность, а на следующий день ноги свежие. Для базы это лучше, чем каждую неделю убиваться на VO2max."
