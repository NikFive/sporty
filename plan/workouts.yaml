  # ───────── КОМБО ─────────
  brick_short:
    sport: brick
    title: Короткий брик
    formula: вел 0:55 → бег 0:20
    warmup: 10 мин вел Z1.
    main: 15 мин Z2 → 2 × 12 мин на мощности гонки через 3 мин легко → транзит → 15 мин бег на темпе гонки.
    cooldown: 5 мин шагом.
    segments: [[10, z1], [15, z2], { x: 2, set: [[12, z3], [3, z1]] }, [15, z3], [5, z1]]
    split: { bike: 55, run: 20 }
    why: За две недели до гонки объём падает, а связка «вел → бег» остаётся острой.
    ref: Mujika & Padilla 2003

  pre_race:
    sport: brick
    title: Предстартовая разминка
    formula: вел 20 → бег 10
    main: 20 мин вел Z2 с 3 × 30 с бодро → 10 мин бег Z2 с 3 ускорениями. Если есть доступ к воде — 10 мин спокойно поплавать в гидрокостюме. Проверь велосипед и снаряжение.
    segments: [[20, z2], [10, z2]]
    split: { bike: 20, run: 10 }
    why: Накануне не тренируемся, а будим тело и проверяем технику. Ноги должны чувствовать себя лёгкими.

  # ── брики: ступени прогрессии, число в id = минуты или повторы ──
  brick_150_30:
    sport: brick
    title: "Длинный брик"
    formula: "вел 2:30 → бег 0:30"
    warmup: "10 мин вел Z1."
    main: "110 мин вел Z2 → 30 мин вел на мощности гонки → быстрый транзит → 30 мин бег на темпе гонки."
    cooldown: "10 мин шагом."
    segments: [[10, z1], [110, z2], [30, z3], [30, z3], [10, z1]]
    split: { bike: 150, run: 40 }
    why: "Брик учит ноги бежать после вела — первые 10 минут бега на гонке самые неприятные, к ним надо привыкнуть заранее. Транзит — тоже навык."
    ref: "Millet & Vleck 2000"
    notes:
      nikita: "На беге после вела пульс подскочит — первые 5 мин держи нижнюю границу."
      vanya: "Не улетай на первых минутах бега, ноги обманывают."

