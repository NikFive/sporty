      nikita: "На беге после вела пульс подскочит — первые 5 мин держи нижнюю границу."
      vanya: "Не улетай на первых минутах бега, ноги обманывают."

  brick_195_45:
    sport: brick
    title: "Длинный брик"
    formula: "вел 3:15 → бег 0:45"
    warmup: "10 мин вел Z1."
    main: "140 мин вел Z2 → 45 мин вел на мощности гонки → быстрый транзит → 45 мин бег на темпе гонки."
    cooldown: "10 мин шагом."
    segments: [[10, z1], [140, z2], [45, z3], [45, z3], [10, z1]]
    split: { bike: 195, run: 55 }
    why: "Брик учит ноги бежать после вела — первые 10 минут бега на гонке самые неприятные, к ним надо привыкнуть заранее. Транзит — тоже навык."
    ref: "Millet & Vleck 2000"
    notes:
      nikita: "На беге после вела пульс подскочит — первые 5 мин держи нижнюю границу."
      vanya: "Не улетай на первых минутах бега, ноги обманывают."

  # ───────── СИЛА ─────────
  strength_full_a:
    sport: strength
    title: Силовая A — тяжёлая
    warmup: 10 мин гребля или вел + суставная. 2 разминочных подхода в первом упражнении.
    main: Присед со штангой 4×4–6 (2 повтора в запасе) · Румынская тяга 3×6 · Жим лёжа 3×6 · Тяга в наклоне 3×8 · Подъём на носки 3×12 · Планка 3×45 с
    cooldown: 5 мин растяжка бедра и икр.
    segments: [[10, mob], [45, str], [5, mob]]
    why: Тяжёлая силовая (мало повторов, большой вес) повышает жёсткость сухожилий и нейромышечную эффективность. Та же скорость стоит меньше энергии (экономичность +2–8%), меньше травм. Массы не прибавляет — повторов мало.
    ref: Rønnestad & Mujika 2014; Blagrove 2018
    notes:
      nikita: С 15 февраля и только с допуском хирурга к нагрузке на плечо. Жимы первые 2–3 недели на 50–60% от привычных весов. Минимум через 6 ч после интенсивного кардио, в отказ не уходи.

  strength_full_b:
    sport: strength
    title: Силовая B — тяжёлая
    warmup: 10 мин гребля или вел + суставная.
    main: Становая тяга 4×4–5 · Болгарские выпады 3×6 на ногу · Жим стоя 3×6 · Подтягивания 3×(макс−2) · Зашагивания с весом 3×8 · Pallof press 3×10
    cooldown: 5 мин растяжка.
    segments: [[10, mob], [45, str], [5, mob]]
    why: Односторонние упражнения выравнивают дисбаланс ног — для бега это профилактика травм. Тяга и подтягивания держат спину на длинном веле.
    ref: Blagrove 2018
    notes:
      nikita: Плиометрика — до силовой, на свежих ногах. Жим стоя и подтягивания — только после допуска к плечу, первые недели легко.

  strength_maint:
    sport: strength
    title: Силовая — поддержка
    warmup: 8 мин суставная + разминочные подходы.
    main: Присед 3×4 · Румынская тяга 3×5 · Жим лёжа 3×5 · Подтягивания 3×5 · Подъём на носки 3×12
    cooldown: 5 мин растяжка.
    segments: [[8, mob], [32, str], [5, mob]]
    why: В build объём кардио растёт, силовую сокращаем до поддержки. Одна тяжёлая сессия в неделю удерживает почти всю силу.
    ref: Rønnestad & Mujika 2014
    notes:
      nikita: Вместе с «верх, гипертрофия» это твои 2 силовые в build. Ноги — тяжело и мало, без отказа. Объём бега растёт, ногам нужно восстанавливаться.

  strength_min_a:
    sport: strength
    title: Силовая — минимум A
    warmup: 5 мин суставная.
    main: Гоблет-присед 3×6–8 (тяжело) · Румынская тяга с гантелями 3×8 · Подъём на носки на одной ноге 3×10 · Боковая планка 2×30 с
    cooldown: 5 мин растяжка.
    segments: [[5, mob], [25, str], [5, mob]]
    why: Минимальная эффективная доза. 2 короткие тяжёлые сессии в неделю дают почти весь эффект для экономичности бега и защиты от травм. Упражнений мало, но вес настоящий.
    ref: Blagrove 2018
    notes:
      vanya: Да, это силовая. Но 35 минут — и всё. Страховка от травм, когда объём бега вырастет.

  strength_min_b:
    sport: strength
    title: Силовая — минимум B
    warmup: 5 мин суставная.
    main: Выпады назад 3×6 на ногу · Ягодичный мост с весом 3×8 · Тяга гантели одной рукой 3×8 · Dead bug 2×10
    cooldown: 5 мин растяжка.
    segments: [[5, mob], [25, str], [5, mob]]
    why: Ягодичные и задняя цепь — то, что держит таз ровно на последних километрах бега.
    ref: Blagrove 2018
    notes:
      vanya: 35 минут. Можно сразу после лёгкой тренировки.

  strength_legs_light:
    sport: strength
    title: Ноги и кор — после операции
    warmup: 5 мин ходьба + суставная для ног.
    main: Жим ногами 3×10 (средний вес) · Сгибание ног 3×10 · Разгибание ног 3×12 · Икры в тренажёре 3×15 · Кор без рук — обратные скручивания лёжа 3×12, dead bug только ногами 3×10.
    cooldown: 5 мин растяжка бедра.
    segments: [[5, mob], [30, str], [5, mob]]
    why: Ноги не должны терять силу, пока плечо заживает. Тренажёры — потому что в них руки ничего не держат. Без натуживания и задержки дыхания — первые дни после операции это важно.
    notes:
      nikita: Только с разрешения хирурга. Ничего не держать оперированной рукой, штангу на спину — нельзя.

  strength_legs_a:
    sport: strength
    title: Силовая A — ноги тяжёлые
    warmup: 10 мин вел + суставная. 2 разминочных подхода в первом упражнении.
    main: Жим ногами 4×5–6 (тяжело, 2 повтора в запасе) · Гакк-присед или присед с поясом (belt squat) 3×6 · Румынская тяга на одной ноге с гантелью в здоровой руке 3×8 · Сгибание ног 3×8 · Икры 3×12 · Кор без опоры на руки 3×12.
    cooldown: 5 мин растяжка бедра и икр.
    segments: [[10, mob], [45, str], [5, mob]]
    why: Тяжёлая силовая на ноги — это экономичность бега и вела (+2–8%) и защита от травм. Пока плечо не готово, грузим ноги так, чтобы рукам нечего было держать.
    ref: Rønnestad & Mujika 2014; Blagrove 2018
    notes:
      nikita: Штангу на плечи — только после допуска к плечу. До этого — тренажёры. Силовая после лёгкого бега в тот же заход — нормально.

  strength_legs_b:
    sport: strength
    title: Силовая B — ноги и задняя цепь
    warmup: 10 мин вел + суставная.
    main: Hip thrust в тренажёре 4×6 · Болгарские выпады (жилет или без веса) 3×8 на ногу · Зашагивания на тумбу 3×8 · Нордические сгибания 3×5 · Подъём на носки на одной ноге 3×12 · Боковая планка на локте здоровой руки 2×30 с.
    cooldown: 5 мин растяжка.
    segments: [[10, mob], [45, str], [5, mob]]
    why: Ягодичные и задняя поверхность бедра держат таз ровно на последних километрах бега. Нордические сгибания — лучшая профилактика травм задней поверхности.
    ref: Blagrove 2018
    notes:
      nikita: Плиометрика — до силовой. Жилет надевать так, чтобы не тянуть плечо.

  strength_upper_hyp:
    sport: strength
    title: Силовая C — верх, гипертрофия
    warmup: 8 мин резинка на ротаторы, лопатки, лёгкие подходы.
    main: Жим гантелей на наклонной 4×8–10 · Подтягивания или тяга верхнего блока 4×8–10 · Жим гантелей сидя 3×10 · Тяга гантели в наклоне 3×10 на руку · Face pull 3×15 · Суперсет бицепс + трицепс 3×12. Последний подход в каждом — за 1–2 повтора до отказа.
    cooldown: 2 мин растяжка груди.
    segments: [[8, mob], [45, str], [2, mob]]
    why: Для роста мышц нужно ~10+ рабочих подходов на мышцу в неделю в диапазоне 6–15 повторов близко к отказу. Верх почти не мешает бегу и велу — «конфликт» силовой и выносливости живёт в основном в ногах. Значит, это самая «дешёвая» тренировка для гибридного атлета.
    ref: Schoenfeld 2017; Schumann 2022
    notes:
      nikita: Только после допуска хирурга к нагрузке на плечо (обычно ~12 недель после реконструкции). Первые 2–3 недели — 50–60% весов, без отказа. Боль в ключице — стоп.

  shoulder_rehab:
    sport: mobility
    title: ЛФК плеча + кор
    main: Упражнения от хирурга или реабилитолога — амплитуда, лопатка, ротаторы с резинкой. Только то, что назначено. Плюс 10 мин кор без опоры на руки.
    segments: [[25, mob]]
    why: Плечо возвращается быстрее и надёжнее, если ЛФК делать регулярно, а не «когда вспомнил». Пока это твоя третья силовая.
    notes:
      nikita: Нет назначения — спроси на первом осмотре. Боль сильнее 3 из 10 — стоп.

  plyo_a:
    sport: plyo
    title: Плиометрика
    warmup: 8 мин — скакалка, суставная, лёгкие подскоки.
    main: Pogo-прыжки 3×20 · Прыжок в длину с места 3×4 · Боковые прыжки через линию 3×10 · Запрыгивание на тумбу 3×5. Полный отдых между подходами.
    cooldown: 2 мин свободно.
    segments: [[8, mob], [10, plyo], [2, mob]]
    why: Короткие реактивные прыжки учат ахилл и стопу работать как пружину. Меньше контакт с землёй, выше экономичность бега. Важно качество, а не усталость.
    ref: Blagrove 2018
    notes:
      nikita: Ты тяжелее — приземляйся мягко и тихо. Шумно = слишком много.

  # ───────── АЛЬТЕРНАТИВА ─────────
  snowboard:
    sport: alt
    title: Сноуборд
    main: Катаемся. Это нагрузка — пей и ешь как на длинной тренировке.
    segments: [[180, alt]]
    why: Неделя смены стимула — голова отдыхает от плана, ноги и кор работают. Форма за неделю не уходит.
    ref: Mujika & Padilla 2000

  hike_snow:
    sport: alt
    title: Подъём пешком
    main: 60–90 мин пешком в гору или на снегоступах, Z1–Z2. Палки только в здоровой руке. Скользко — лучше по ровному.
    segments: [[75, alt]]
    why: Ваня на склоне, ты тоже в горах и в движении — аэробная работа без риска упасть на плечо.
    notes:
      nikita: Хирург разрешил доску — катайся спокойно, без парка и прыжков, и в защите плеча.

  mobility_short:
    sport: mobility
    title: Мобилити + кор
    main: Кошка-корова · 90/90 для бедра · Выпады с ротацией · Планка 3×40 с · Ягодичный мост 2×15
    segments: [[20, mob]]
    why: 20 минут вечером после катания — спина и бёдра скажут спасибо.

  race:
    sport: race
    title: "70.3"
    main: 1.9 км плавание · 90 км вел · 21.1 км бег. Всё по плану питания и темпа.
    segments: [[40, z3], [5, z1], [170, z3], [5, z1], [120, z3]]
    why: Ради этого всё.
