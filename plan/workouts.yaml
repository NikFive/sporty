# yaml-language-server: $schema=./schema/workouts.schema.json
# Библиотека тренировок. Контракт и примеры — plan/README.md. Проверка: npm run validate
#
# Ключ — id тренировки (латиница, цифры, _). На него ссылаются templates.yaml и calendar.yaml.
# Переименовал id → поправь все ссылки (validate покажет, где).
#
# segments — профиль для графика и статистики 80/20:
#   [минуты, зона]                      — отрезок; зоны: z1..z5, str (силовая), plyo, mob (мобилити), alt (альтернатива)
#   { x: 5, set: [[4, z5], [3, z1]] }   — повтор
# formula: «10×100 м CSS» — короткая формула основной части (иначе считается из первого повтора).
# zone: z4 — принудительная «ключевая зона» для цветного квадрата (иначе считается из segments).
# notes: { nikita: ..., vanya: ... } — личные заметки атлету.

workouts:
  # ───────── БЕГ ─────────
  run_easy_strides:
    sport: run
    title: Лёгкий бег + ускорения
    warmup: 10 мин очень легко (Z1), последние 2 мин — беговые упражнения (захлёст, высокое бедро).
    main: 25 мин ровно в Z2. Затем 6 × 20 с ускорение до ~90% от максимума, между ними 40 с шагом.
    cooldown: 5 мин шагом, растяжка икр и сгибателей бедра.
    segments: [[10, z1], [25, z2], { x: 6, set: [[0.33, z5], [0.67, z1]] }, [5, z1]]
    why: Z2 растит митохондрии и капилляры — фундамент для 70.3. Короткие ускорения почти не утомляют, но учат нервную систему быстрой технике и улучшают экономичность бега.
    ref: Seiler 2010
    notes:
      nikita: Ориентир — пульс, не темп. Уползает в Z3 — замедлись или перейди на шаг на 30–60 с. В начале базы это нормально.
      vanya: Бежите вместе, но у Никиты свой пульс. Не тяни. Хочется быстрее — вложи это в ускорения, а не в темп.

  run_z2:
    sport: run
    title: Бег Z2
    warmup: 5 мин очень легко.
    main: 30 мин в Z2. Ровно, без «ну чуть быстрее».
    cooldown: 5 мин шагом.
    segments: [[5, z1], [30, z2], [5, z1]]
    why: Около 80% объёма — в лёгких зонах. Именно эти скучные минуты строят аэробный мотор, а нагрузка на организм остаётся небольшой.
    ref: Seiler 2010
    notes:
      nikita: Пульс выше Z2 — шаг 1 мин и снова бег. Лучше медленно, но в зоне.
      vanya: Свой Z2. Если бежите вместе — твой темп подстраивается, а не его.

  run_long_z2:
    sport: run
    title: Длинный бег
    warmup: 10 мин очень легко.
    main: 55 мин в Z2.
    cooldown: 5 мин шагом.
    segments: [[10, z1], [55, z2], [5, z1]]
    why: Главный стимул беговой выносливости — растут запасы гликогена, жир как топливо, крепнут связки. Строго Z2, иначе это уже другая тренировка.
    ref: Seiler 2010
    notes:
      nikita: Можно бег-шаг 9:1, если к концу пульс ползёт вверх (кардиодрейф). Возьми воду.
      vanya: Стартуете и финишируете вместе, середина — каждый в своей зоне.

  run_long_build:
    sport: run
    title: Длинный бег
    warmup: 10 мин очень легко.
    main: 70 мин в Z2. Каждые 20 мин — глоток и гель/углеводы, тренируем живот.
    cooldown: 5 мин шагом.
    segments: [[10, z1], [70, z2], [5, z1]]
    why: На 70.3 бег идёт после 4+ часов работы. Длинный Z2 растит выносливость, не съедая восстановление.
    ref: Seiler 2010
    notes:
      nikita: Кардиодрейф — сигнал замедлиться, а не терпеть.
      vanya: Ровно. Последние 10 мин можно на верх Z2, если всё хорошо.

  run_threshold:
    sport: run
    title: Бег — порог
    warmup: 10 мин Z1, 5 мин Z2 + 3 ускорения.
    main: 3 × 10 мин в Z4, между ними 3 мин трусцой.
    cooldown: 6 мин легко.
    segments: [[10, z1], [5, z2], { x: 3, set: [[10, z4], [3, z1]] }, [6, z1]]
    why: Порог — граница, после которой копится лактат. Работа на пороге поднимает её. На 70.3 ты бежишь ниже порога, и чем он выше, тем быстрее твой «комфорт».
    ref: Stöggl & Sperlich 2014
    notes:
      nikita: Порог по пульсу, не по темпу Вани. Бегите в разных темпах, встречайтесь на заминке.
      vanya: Не уходи в Z5 на первом отрезке. Третий должен быть самым ровным.

  run_race_pace:
    sport: run
    title: Бег — темп гонки
    warmup: 10 мин Z1, 10 мин Z2.
    main: 3 × 12 мин на темпе 70.3 (низ Z3), между ними 3 мин трусцой.
    cooldown: 5 мин легко.
    segments: [[10, z1], [10, z2], { x: 3, set: [[12, z3], [3, z1]] }, [5, z1]]
    why: Специфика — тело запоминает ровно тот темп, который держать на гонке. Здесь Z3 уместна, потому что это и есть гоночная интенсивность.
    ref: Seiler 2010
    notes:
      nikita: Темп гонки у вас разный. Держи свой по пульсу.
      vanya: Не быстрее плана — это не соревнование на тренировке.

  run_openers:
    sport: run
    title: Активация
    warmup: 10 мин Z1.
    main: 15 мин Z2 + 4 × 1 мин бодро (Z4) через 1 мин трусцой.
    cooldown: 2 мин шагом.
    segments: [[10, z1], [15, z2], { x: 4, set: [[1, z4], [1, z1]] }, [2, z1]]
    why: В подводке объём падает, а острота остаётся. Короткие отрезки держат ноги «живыми» без усталости.
    ref: Mujika & Padilla 2003

  # ───────── ВЕЛ ─────────
  bike_vo2:
    sport: bike
    title: Вел — интервалы VO2max
    warmup: 10 мин Z1, 5 мин Z2 с тремя 30-секундными ускорениями.
    main: 5 × 4 мин в Z5, между ними 3 мин очень легко.
    cooldown: 10 мин Z1.
    segments: [[10, z1], [5, z2], { x: 5, set: [[4, z5], [3, z1]] }, [10, z1]]
    why: Та самая «тяжёлая» часть модели 80/20. Интервалы около МПК — сильнейший стимул для VO2max и ударного объёма сердца. На станке проще держать мощность ровно.
    ref: Stöggl & Sperlich 2014
    notes:
      nikita: Ватты свои. Последний интервал = первому. Падаешь больше 5% — значит, начал слишком бодро.
      vanya: Делайте интервалы синхронно, это веселее. Но цифры у каждого свои.

  bike_z2:
    sport: bike
    title: Вел Z2
    warmup: 10 мин Z1.
    main: 60 мин в Z2, каденс 85–95.
    cooldown: 5 мин Z1.
    segments: [[10, z1], [60, z2], [5, z1]]
    why: Аэробный объём почти без ударной нагрузки — можно накатывать часы без риска для связок.
    ref: Seiler 2010

  bike_long_z2:
    sport: bike
    title: Длинный вел
    warmup: 10 мин Z1.
    main: 95 мин в Z2. Каждые 20–30 мин — глоток и углеводы (30–60 г/ч).
    cooldown: 5 мин Z1.
    segments: [[10, z1], [95, z2], [5, z1]]
    why: Вел — самая длинная часть 70.3 (90 км). Тренируем жировой обмен и привычку есть на ходу уже с базы.
    ref: Seiler 2010
    notes:
      nikita: Ты тяжелее — на станке это не мешает, ватты в Z2 у тебя могут быть выше. Не сравнивайтесь.
      vanya: Тот же Z2 по пульсу. Каденс держи высоким.

  bike_threshold:
    sport: bike
    title: Вел — порог
    warmup: 10 мин Z1, 5 мин Z2.
    main: 3 × 12 мин в Z4, между ними 4 мин легко.
    cooldown: 12 мин Z1.
    segments: [[10, z1], [5, z2], { x: 3, set: [[12, z4], [4, z1]] }, [12, z1]]
    why: Пороговая мощность (FTP) определяет, сколько ватт ты удержишь 2+ часа на гонке без взрыва.
    ref: Stöggl & Sperlich 2014

  bike_long_build:
    sport: bike
    title: Длинный вел с темпом
    warmup: 10 мин Z1.
    main: 60 мин Z2, затем 3 × 15 мин на темпе гонки (Z3) через 10 мин Z2, затем 25 мин Z2. Питание по плану гонки.
    cooldown: 10 мин Z1.
    segments: [[10, z1], [60, z2], { x: 3, set: [[15, z3], [10, z2]] }, [25, z2], [10, z1]]
    why: Длинный объём плюс отрезки на гоночной мощности. Учимся держать темп, когда уже устал.
    ref: Rønnestad & Mujika 2014

  bike_race_pace:
    sport: bike
    title: Вел — темп гонки
    warmup: 10 мин Z1, 15 мин Z2.
    main: 2 × 30 мин на темпе гонки (Z3), между ними 5 мин легко.
    cooldown: 5 мин Z1.
    segments: [[10, z1], [15, z2], { x: 2, set: [[30, z3], [5, z1]] }, [5, z1]]
    why: Длинные гоночные отрезки — главная специфическая работа под 90 км.
    ref: Seiler 2010

  bike_openers:
    sport: bike
    title: Вел — активация
    warmup: 10 мин Z1.
    main: 20 мин Z2 + 3 × 2 мин в Z4 через 2 мин легко.
    cooldown: 3 мин Z1.
    segments: [[10, z1], [20, z2], { x: 3, set: [[2, z4], [2, z1]] }, [3, z1]]
    why: Короткая острота без усталости перед гонкой.
    ref: Mujika & Padilla 2003

  # ───────── ПЛАВАНИЕ ─────────
  swim_technique:
    sport: swim
    title: Плавание — техника
    warmup: 200 м спокойно любым стилем.
    main: 8 × 50 м упражнения (catch-up, одна рука, «доска на боку») + 4 × 100 м кролем в Z2, фокус на выдохе в воду.
    cooldown: 100 м спокойно.
    segments: [[8, z1], [22, z1], [12, z2], [3, z1]]
    why: В плавании экономичность гребка решает больше, чем «мотор». Пока база — ставим технику, объём придёт в build.
    ref: Toussaint & Hollander 1994
    notes:
      nikita: Первые недели после восстановления — без лопаток и резких усилий. Слушай ощущения.
      vanya: Работаешь над тем же — техника у вас обоих важнее объёма.

  swim_aerobic:
    sport: swim
    title: Плавание Z2
    warmup: 300 м спокойно.
    main: 4 × 200 м в Z2 через 30 с отдыха + 4 × 50 м упражнения.
    cooldown: 100 м спокойно.
    segments: [[8, z1], [32, z2], [6, z1], [4, z1]]
    why: Аэробная база в воде и привычка держать технику, когда устаёшь.
    ref: Seiler 2010

  swim_css:
    sport: swim
    title: Плавание — CSS
    formula: 10×100 м CSS
    warmup: 400 м спокойно + 4 × 50 м с ускорением.
    main: 10 × 100 м на темпе CSS (Z4) через 15 с отдыха.
    cooldown: 200 м спокойно.
    segments: [[12, z1], { x: 10, set: [[1.8, z4], [0.25, z1]] }, [6, z1]]
    why: CSS — пороговый темп в воде. Работа на нём поднимает скорость, которую держишь 1.9 км.
    ref: Stöggl & Sperlich 2014

  swim_short:
    sport: swim
    title: Плавание — активация
    formula: 4×100 м Z3
    warmup: 300 м спокойно.
    main: 4 × 100 м бодро (Z3) через 30 с.
    cooldown: 200 м спокойно.
    segments: [[8, z1], { x: 4, set: [[2, z3], [1, z1]] }, [10, z1]]
    why: Сохраняем чувство воды, не тратя силы.
    ref: Mujika & Padilla 2003

  # ───────── КОМБО ─────────
  brick_long:
    sport: brick
    title: Длинный брик
    formula: вел 2:10 → бег 0:30
    warmup: 10 мин вел Z1.
    main: 90 мин вел Z2 → 40 мин вел на темпе гонки → быстрый транзит → 30 мин бег на темпе гонки.
    cooldown: 10 мин шагом.
    segments: [[10, z1], [90, z2], [40, z3], [30, z3], [10, z1]]
    why: Брик учит ноги бежать после вела — первые 10 минут бега на гонке самые неприятные, к ним надо привыкнуть заранее. Транзит — тоже навык.
    ref: Millet & Vleck 2000
    notes:
      nikita: На беге после вела пульс подскочит — первые 5 мин держи нижнюю границу.
      vanya: Не улетай на первых минутах бега, ноги обманывают.

  # ───────── СИЛА ─────────
  strength_full_a:
    sport: strength
    title: Силовая A — тяжёлая
    warmup: 10 мин гребля или вел + суставная. 2 разминочных подхода в первом упражнении.
    main: Присед со штангой 4×4–6 (2 повтора в запасе) · Румынская тяга 3×6 · Жим лёжа 3×6 · Тяга в наклоне 3×8 · Подъём на носки 3×12 · Планка 3×45 с
    cooldown: 5 мин растяжка бедра и икр.
    segments: [[10, mob], [45, str], [5, mob]]
    why: Тяжёлая силовая (мало повторов, большой вес) повышает жёсткость сухожилий и нейромышечную эффективность. Та же скорость стоит меньше энергии (экономичность +2–8%), меньше травм. Массы не прибавляет — повторов мало.
    ref: Rønnestad & Mujika 2014; Blagrove 2018
    notes:
      nikita: Минимум через 6 ч после интенсивного кардио. База с борьбы — плюс, но в отказ не уходи.

  strength_full_b:
    sport: strength
    title: Силовая B — тяжёлая
    warmup: 10 мин гребля или вел + суставная.
    main: Становая тяга 4×4–5 · Болгарские выпады 3×6 на ногу · Жим стоя 3×6 · Подтягивания 3×(макс−2) · Зашагивания с весом 3×8 · Pallof press 3×10
    cooldown: 5 мин растяжка.
    segments: [[10, mob], [45, str], [5, mob]]
    why: Односторонние упражнения выравнивают дисбаланс ног — для бега это профилактика травм. Тяга и подтягивания держат спину на длинном веле.
    ref: Blagrove 2018
    notes:
      nikita: Плиометрика — до силовой, на свежих ногах.

  strength_maint:
    sport: strength
    title: Силовая — поддержка
    warmup: 8 мин суставная + разминочные подходы.
    main: Присед 3×4 · Румынская тяга 3×5 · Подтягивания 3×5 · Подъём на носки 3×12
    cooldown: 5 мин растяжка.
    segments: [[8, mob], [32, str], [5, mob]]
    why: В build объём кардио растёт, силовую сокращаем до поддержки. Одна тяжёлая сессия в неделю удерживает почти всю силу.
    ref: Rønnestad & Mujika 2014

  strength_min_a:
    sport: strength
    title: Силовая — минимум A
    warmup: 5 мин суставная.
    main: Гоблет-присед 3×6–8 (тяжело) · Румынская тяга с гантелями 3×8 · Подъём на носки на одной ноге 3×10 · Боковая планка 2×30 с
    cooldown: 5 мин растяжка.
    segments: [[5, mob], [25, str], [5, mob]]
    why: Минимальная эффективная доза. 2 короткие тяжёлые сессии в неделю дают почти весь эффект для экономичности бега и защиты от травм. Упражнений мало, но вес настоящий.
    ref: Blagrove 2018
    notes:
      vanya: Да, это силовая. Но 35 минут — и всё. Страховка от травм, когда объём бега вырастет.

  strength_min_b:
    sport: strength
    title: Силовая — минимум B
    warmup: 5 мин суставная.
    main: Выпады назад 3×6 на ногу · Ягодичный мост с весом 3×8 · Тяга гантели одной рукой 3×8 · Dead bug 2×10
    cooldown: 5 мин растяжка.
    segments: [[5, mob], [25, str], [5, mob]]
    why: Ягодичные и задняя цепь — то, что держит таз ровно на последних километрах бега.
    ref: Blagrove 2018
    notes:
      vanya: 35 минут. Можно сразу после лёгкой тренировки.

  plyo_a:
    sport: plyo
    title: Плиометрика
    warmup: 8 мин — скакалка, суставная, лёгкие подскоки.
    main: Pogo-прыжки 3×20 · Прыжок в длину с места 3×4 · Боковые прыжки через линию 3×10 · Запрыгивание на тумбу 3×5. Полный отдых между подходами.
    cooldown: 2 мин свободно.
    segments: [[8, mob], [10, plyo], [2, mob]]
    why: Короткие реактивные прыжки учат ахилл и стопу работать как пружину. Меньше контакт с землёй, выше экономичность бега. Важно качество, а не усталость.
    ref: Blagrove 2018
    notes:
      nikita: Ты тяжелее — приземляйся мягко и тихо. Шумно = слишком много.

  # ───────── АЛЬТЕРНАТИВА ─────────
  snowboard:
    sport: alt
    title: Сноуборд
    main: Катаемся. Это нагрузка — пей и ешь как на длинной тренировке.
    segments: [[180, alt]]
    why: Неделя смены стимула — голова отдыхает от плана, ноги и кор работают. Форма за неделю не уходит.
    ref: Mujika & Padilla 2000

  mobility_short:
    sport: mobility
    title: Мобилити + кор
    main: Кошка-корова · 90/90 для бедра · Выпады с ротацией · Планка 3×40 с · Ягодичный мост 2×15
    segments: [[20, mob]]
    why: 20 минут вечером после катания — спина и бёдра скажут спасибо.

  race:
    sport: race
    title: "70.3"
    main: 1.9 км плавание · 90 км вел · 21.1 км бег. Всё по плану питания и темпа.
    segments: [[40, z3], [5, z1], [170, z3], [5, z1], [120, z3]]
    why: Ради этого всё.
